name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:
    inputs:
      function:
        description: "Function to deploy (use all for every function)"
        required: true
        default: "all"
        type: choice
        options:
          - all
          - ai-chat
          - analyze-ecommerce
          - generate-creatives
          - connections-update
          - connections-status
          - platform-items-list
          - sync-platforms
          - adsense-oauth-start
          - adsense-oauth-callback

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: orifwrskrtafulrmckhw

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate deployment secret
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured in GitHub Actions secrets."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy all Edge Functions
        if: ${{ inputs.function == 'all' }}
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy selected Edge Function
        if: ${{ inputs.function != 'all' }}
        run: supabase functions deploy "${{ inputs.function }}" --project-ref "$SUPABASE_PROJECT_ID"

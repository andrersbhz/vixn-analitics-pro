name: Release XYXN Analytics 1.2

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: contains(github.event.head_commit.message, 'XYXN Analytics v1.2.0')
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: orifwrskrtafulrmckhw

    steps:
      - name: Checkout release
        uses: actions/checkout@v4

      - name: Validate release secrets
        shell: bash
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "SUPABASE_DB_PASSWORD is not configured."
            exit 1
          fi

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD"

      - name: Apply database migrations
        run: supabase db push

      - name: Deploy Edge Functions
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_ID"

      - name: Release summary
        run: |
          echo "XYXN Analytics v1.2.0 Supabase release completed."
          echo "Project: $SUPABASE_PROJECT_ID"
